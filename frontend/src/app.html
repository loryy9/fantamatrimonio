<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="app-theme-color" content="#faf7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FantaMatrimonio" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><g fill=%22none%22 stroke=%22%238c2f4b%22 stroke-width=%228%22><circle cx=%2238%22 cy=%2250%22 r=%2222%22/><circle cx=%2262%22 cy=%2250%22 r=%2222%22/></g></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Fanta Matrimonio</title>
    <style>
      /* Splash mostrato finché l'app non ha recuperato la sessione (lo rimuove il layout radice) */
      #splash { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #faf7f2; }
      #splash svg { color: #c59e58; animation: splash-pulse 1.5s infinite; }
      #splash .splash-title { font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #8c2f4b 0%, #b94b68 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #splash .splash-spinner { width: 28px; height: 28px; border: 3px solid rgba(140, 47, 75, 0.15); border-top-color: #8c2f4b; border-radius: 50%; animation: splash-spin 0.8s linear infinite; }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.85; } }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="12" r="5"></circle>
        <circle cx="15" cy="12" r="5"></circle>
      </svg>
      <div class="splash-title">Fanta Matrimonio</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
